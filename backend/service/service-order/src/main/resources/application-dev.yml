server:
  port: 8514
  tomcat:
    threads:
      max: 300
      min-spare: 30
    accept-count: 500
    max-connections: 8000

spring:
  application:
    name: service-order
  config:
    import: optional:nacos:${NACOS_HOST:localhost}:8848
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:localhost}:8848
      config:
        server-addr: ${NACOS_HOST:localhost}:8848
        file-extension: yaml
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/yitai_mall?serverTimezone=UTC&characterEncoding=utf8&useUnicode=true&useSSL=true&connectTimeout=5000&socketTimeout=10000
    username: root
    password: ${MYSQL_PASSWORD:root}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: OrderHikariCP
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      lettuce:
        pool:
          max-active: 100
          max-idle: 50
          min-idle: 10
          max-wait: 3000

mybatis:
  config-location: classpath:mybatis-config.xml
  mapper-locations: classpath:mapper/*/*.xml
